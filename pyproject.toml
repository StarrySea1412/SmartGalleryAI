[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-gallery-ai"
version = "0.1.0"
description = "Local-first intelligent gallery backend built with Python."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "SmartGalleryAI Contributors" }]
dependencies = [
  "aiofiles>=24.1.0",
  "alembic>=1.13.2",
  "celery>=5.4.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pillow>=10.4.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "redis>=5.0.8",
  "sqlalchemy>=2.0.32",
  "typer>=0.12.3",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11.1",
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.5.7"
]
ai = [
  "paddleocr>=2.8.1",
  "paddlepaddle>=2.6.2",
  "sentence-transformers>=3.0.1",
  "torch>=2.4.0",
  "transformers>=4.44.0"
]
postgres = [
  "pgvector>=0.3.3",
  "psycopg[binary]>=3.2.1"
]
qdrant = [
  "qdrant-client>=1.11.1"
]

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

